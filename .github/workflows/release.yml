# v로 시작하는 태그(예: v1.0.1)를 올리면: 테스트 → 빌드 → 설치 파일 만들기 → GitHub Release에 업로드
# 설치된 앱은 이 Release를 보고 스스로 업데이트한다 (host/UpdateService.cs)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.161   # host/SpotifyWallpaper.csproj의 Velopack 패키지 버전과 맞춘다
  PACK_ID: SpotifyWallpaper.App

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got $env:GITHUB_REF_NAME)" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/SpotifyWallpaper.Tests -c Release -nologo

      - name: Publish
        run: >
          dotnet publish host -c Release -r win-x64 --self-contained true -o publish -nologo
          -p:Version=${{ env.VERSION }}
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # 이전 Release를 받아 두면 작은 차등(delta) 업데이트도 함께 만든다. 첫 Release에서는 받을 것이 없어 실패해도 괜찮다
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o releases

      # Release 페이지 본문 (설치 안내)
      - name: Release notes
        shell: pwsh
        run: |
          $notes = @(
            '## 설치'
            ''
            '1. 아래 **Assets**에서 `SpotifyWallpaper.App-win-Setup.exe`를 받아 실행합니다.'
            '2. "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누릅니다. (서명하지 않은 프로그램이라 처음 한 번 뜹니다)'
            '3. 설치가 끝나면 바로 켜지고, 작업 표시줄 오른쪽 트레이 아이콘에서 설정할 수 있습니다.'
            ''
            '설치하지 않고 쓰려면 `SpotifyWallpaper.App-win-Portable.zip`을 풀어 `SpotifyWallpaper.exe`를 실행하세요.'
            ''
            '이미 설치했다면 앱이 새 버전을 스스로 내려받아 알려 줍니다.'
          )
          $notes -join "`n" | Out-File -Encoding utf8 release-notes.md

      - name: Pack
        run: >
          vpk pack -u ${{ env.PACK_ID }} -v ${{ env.VERSION }} -p publish -e SpotifyWallpaper.exe
          --packTitle "Spotify Wallpaper" --packAuthors powder -i host/app.ico
          -f webview2 --shortcuts StartMenuRoot --releaseNotes release-notes.md -o releases

      - name: Upload to GitHub Release
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          -o releases --publish --tag ${{ github.ref_name }} --releaseName "Spotify Wallpaper ${{ env.VERSION }}"
