<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify Wallpaper</title>
  <!-- 폰트는 전부 로컬 파일 (dev/fetch-fonts.mjs 로 받아 둔 것) — 실행 중 외부 서버에 접속하지 않는다 -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="ui">
    <!-- 앨범아트 아래: 진행 바 + 제목/아티스트 (아트 사각형에 맞춰 매 프레임 배치) -->
    <div id="meta">
      <div class="meta-progress"><div class="meta-progress-fill"></div></div>
      <div class="meta-text">
        <div class="meta-title"></div>
        <div class="meta-artist"></div>
      </div>
    </div>

    <!-- 싱크 가사 (가사가 없는 곡은 같은 자리에 얇은 파형 한 줄) -->
    <div id="lyrics">
      <div class="lyrics-viewport"><div class="lyrics-track"></div></div>
      <canvas class="wave"></canvas>
    </div>
  </div>

  <div id="dev-hint"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
